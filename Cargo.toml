[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "LGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
mctk-nbt = { path = "crates/mctk-nbt" }
mctk-anvil = { path = "crates/mctk-anvil" }
mctk-java = { path = "crates/mctk-java" }
mctk-leveldb = { path = "crates/mctk-leveldb" }
mctk-bedrock = { path = "crates/mctk-bedrock" }
mctk-console = { path = "crates/mctk-console" }
mctk-convert = { path = "crates/mctk-convert" }
mctk-prune = { path = "crates/mctk-prune" }
mctk-mapping = { path = "crates/mctk-mapping" }
mctk-world = { path = "crates/mctk-world" }
mctk-registry = { path = "crates/mctk-registry" }
mctk-replace = { path = "crates/mctk-replace" }
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
flate2 = "1.0.30"
indexmap = "2.2.6"
thiserror = "1.0.61"
clap = { version = "4.5.4", features = ["derive"] }
serde_json = "1.0.120"

# Release builds: link-time optimisation across the crates, one codegen unit for the biggest
# (the hot paths are the world meshing and the converters), symbols stripped, no unwinding tables
# for panics we never catch.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"

# Dev builds: the dependencies (image decoding, compression) optimised, so the app is usable
# when run from cargo run.
[profile.dev.package."*"]
opt-level = 2
