name: Build

# Every push and pull request is built and tested. A push to main also publishes a GitHub
# release, with the Windows app and command-line tool attached, when the version in Cargo.toml
# has not been released yet. To make a new release: raise `version` in Cargo.toml and push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test
        run: cargo test --workspace --release

      - name: Build
        run: cargo build --release -p mctk-gui -p mctk-cli

      - name: Package
        shell: pwsh
        run: |
          $name = "MCToolKit-v${{ steps.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Path dist/$name | Out-Null
          Copy-Item target/release/MCToolKit.exe, target/release/mctoolkit.exe, LICENSE, THIRD_PARTY_LICENSES.md, README.md dist/$name
          Compress-Archive -Path dist/$name/* -DestinationPath dist/$name.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MCToolKit-windows-x64
          path: dist/*.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Has this version been released already?
        id: existing
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; raise the version in Cargo.toml to publish a new one."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existing.outputs.released == 'false'
        uses: actions/download-artifact@v4
        with:
          name: MCToolKit-windows-x64

      - if: steps.existing.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: MCToolKit ${{ env.TAG }}
          files: "*.zip"
          generate_release_notes: true
          # 0.x releases are marked as pre-releases.
          prerelease: ${{ startsWith(env.TAG, 'v0.') || contains(env.TAG, '-') }}
