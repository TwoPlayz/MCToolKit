[package]
name = "mctk-gui"
description = "MCToolKit desktop app: world browser, NBT editor, converter, pruner and map"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "MCToolKit"
path = "src/main.rs"

[dependencies]
mctk-nbt.workspace = true
mctk-anvil.workspace = true
mctk-java.workspace = true
mctk-bedrock.workspace = true
mctk-console.workspace = true
mctk-convert.workspace = true
mctk-registry.workspace = true
mctk-replace.workspace = true
mctk-prune.workspace = true
mctk-mapping.workspace = true
mctk-world.workspace = true
# The world viewer draws with wgpu on the GPU (Vulkan, or Direct3D 12 on Windows, which eframe
# leaves out by default); OpenGL stays as the fallback.
eframe = { version = "=0.31.1", features = ["wgpu"] }
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
rfd = "=0.15.3"
flate2.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip.workspace = true
serde_json.workspace = true
mctk-leveldb.workspace = true
raw-window-handle = "0.6"
ureq = "2.12"
resvg = { version = "0.50.0", default-features = false }

[dev-dependencies]
tiny-skia = "0.11"

[build-dependencies]
embed-resource = "3"
